# @package _global_

defaults:
  - override /task:  train_memory
  - override /model: augmented_llama
  - _self_

experiment_path: "naive_softprompt/test"
hydra:
    mode: MULTIRUN
    sweep:
        subdir: ${task.num_train_epochs}_epochs
    sweeper:
        params:
            task.num_train_epochs: 1, 2

task:
    num_train_epochs: 1
    trainable_strategy: "soft_prompt_only"
    extrinsic_validation:
        frequency: END
        sample_count: 100
        log_predictions: yes
