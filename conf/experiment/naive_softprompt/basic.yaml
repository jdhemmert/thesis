# @package _global_

defaults:
  - override /task:  train_memory
  - override /model: augmented_llama
  - _self_

model:
  architecture: augmented-llama
  model_config:
    initialization_method: RANDOM
    initialization_noise_level: 0.01

experiment_path: "naive_softprompt/test"
hydra:
    mode: MULTIRUN
    sweep:
        subdir: ${task.num_train_epochs}_epochs
    sweeper:
        params:
            task.num_train_epochs: 1, 2

task:
    num_train_epochs: 1
    trainable_strategy: "soft_prompt_only"

    extrinsic_validation:
        frequency: END
        metric_type: evaluate
        metric_config:
            metric_name: rouge
            sample_count: 100
            log_predictions: yes
