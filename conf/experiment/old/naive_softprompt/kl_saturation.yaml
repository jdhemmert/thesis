# @package _global_

defaults:
  - /task/extrinsic_validation: rouge
  - override /task:  train_memory
  - override /model: augmented_llama
  - _self_


experiment_path: "naive_softprompt/kl_saturation"
hydra:
    mode: MULTIRUN
    sweep:
        subdir: ${task.sample_n}samples_${model.model_config.virtual_token_count}tokens
    sweeper:
        params:
            task.sample_n: 50, 100, 500, 1000
            model.model_config.virtual_token_count: 20, 50, 100, 500, 1000

task:
    num_train_epochs: 100

    learning_rate: 5e-2
    lr_scheduler_type: constant
    
    trainable_strategy: "soft_prompt_only"
    
    extrinsic_validation:
        metric_config:
            sample_count: 100
