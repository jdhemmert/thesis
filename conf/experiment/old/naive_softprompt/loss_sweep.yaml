# @package _global_

defaults:
  # - /adapter: qa_finetune
  - /task/extrinsic_validation: rouge
  - override /task:  train_memory
  - override /model: augmented_llama
  - _self_


experiment_path: "naive_softprompt/loss_sweep"
hydra:
    mode: MULTIRUN
    sweep:
        subdir: ${task.alpha}alpha_${task.temperature}temp
    sweeper:
        params:
            task.alpha: 0.0, 0.25, 0.5, 0.75, 1.0
            task.temperature: 0.1, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2.0

task:
    sample_n: 1
    num_train_epochs: 50
    trainable_strategy: soft_prompt_only

model:
    model_config:
        virtual_token_count: 12
