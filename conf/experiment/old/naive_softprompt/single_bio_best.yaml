# @package _global_

defaults:
    - /adapter: qa_finetune
    - /task/extrinsic_validation: rouge
    - override /task: train_memory
    - override /model: augmented_llama
    - override /dataset: qa_12k
    - override /hydra/sweeper: optuna
    - _self_


experiment_path: "naive_softprompt/single_bio/best"

task:
    sample_n: 1
    num_train_epochs: 33

    learning_rate: 0.00966894684401972
    alpha: 0.9
    temperature: 2.0

model:
    model_config:
        virtual_token_count: 17

