# @package _global_

defaults:
    - override /task: train_memory
    - override /model: augmented_llama
    - override /dataset: qa_12k
    - override /hydra/sweeper: optuna
    - _self_


experiment_path: "naive_softprompt/single_bio/sweep"


hydra:
    mode: MULTIRUN
    sweeper:
        direction: minimize
        study_name: single_bio_${task.return_metric_key}
        n_trials: 100

        params:

            task.num_train_epochs: range(1, 50)
            task.learning_rate: tag(log, interval(1e-5, 1e-2))
            task.alpha: interval(0.0, 1.0)
            task.temperature: interval(0.1, 10.0)

            model.model_config.virtual_token_count: range(1, 20)


task:
    sample_n: 1

model:
    model_config:
        adapter_path: "results/finetune_test/qa"