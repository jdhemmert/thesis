# @package _group_
#
# This config defines the local launcher for Hydra, integrated with Hugging Face Accelerate.
#
# To use this launcher, you would typically run your script with:
# python run.py hydra/launcher=local_accelerate [your_other_hydra_overrides]

# Local parameters for the submitit launcher when running directly on a node.
submitit_local:
  # Accelerate specific integration for submitit-launcher
  # This tells the submitit launcher to wrap your command with 'accelerate launch'.
  accelerate: true

  # Arguments to pass directly to the 'accelerate launch' command.
  # For local runs, you would typically specify --num_processes explicitly
  # or rely on accelerate's default detection of visible GPUs.
  num_processes: 1 # Example: Set this to the number of GPUs you want to use locally
  accelerate_args: "--num_processes ${.num_processes} --mixed_precision bf16"
  # Other common accelerate_args can be added here
