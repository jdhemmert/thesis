# @package _group_
#
# This config defines the Slurm launcher for Hydra, integrated with Hugging Face Accelerate.
#
# To use this launcher, you would typically run your script with:
# python src/training/finetune.py hydra/launcher=slurm_accelerate [your_other_hydra_overrides]

# Slurm specific parameters for the submitit launcher.
# These will be translated into #SBATCH directives in the generated Slurm script.
submitit_slurm:
  # General Slurm resource requests
  partition: gpu_your_cluster_partition # Replace with your cluster's GPU partition name
  nodes: 1                              # Number of nodes to request
  tasks_per_node: 4                     # Number of tasks (processes) to run on each node
                                        # For multi-GPU training, this often matches gpus_per_node
  gpus_per_node: 4                      # Number of GPUs to request on each node
  mem_gb: 128                           # Total memory in GB per node
  timeout_min: 480                      # Time limit for the job in minutes (8 hours)
  cpus_per_task: 10                     # Number of CPU cores allocated per task
  job_name: "hydra_accel_finetune"      # Name for the Slurm job

  # Log directory for Submitit's internal job logs (not your application logs)
  logs_dir: ${oc.env:SLURM_LOGS_DIR,./slurm_logs} # Uses SLURM_LOGS_DIR env var if set, otherwise ./slurm_logs

  # Accelerate specific integration for submitit-launcher
  # This tells the submitit launcher to wrap your command with 'accelerate launch'.
  accelerate: true

  # Arguments to pass directly to the 'accelerate launch' command.
  # Note: ${.gpus_per_node} is a Hydra interpolation that uses the 'gpus_per_node'
  # defined within the same configuration group.
  accelerate_args: "--num_processes ${.gpus_per_node} --mixed_precision bf16"
  # Other common accelerate_args:
  # --num_machines 1 (or >1 for multi-node)
  # --dynamo_backend "inductor"
  # --gradient_accumulation_steps 8
