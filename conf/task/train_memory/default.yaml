# @package task.train_memory
defaults:
  - strategy/memory_bank: prompt_default
  - strategy/lora_adapter: lora_default
  - _self_

name: "train_memory"
output_dir: "models/memory_model"
learning_rate: 2e-4
num_train_epochs: 3
precision: "bf16"
seed: 42
max_length: 512
eval_steps: 100
sample_n: 1000
log_predictions: true

loss:
  loss_type: "balanced"
  alpha: 0.2
  temperature: 0.5

strategy:
  name: "meta"
  
  memory_bank: ???
  lora_adapter: ???

  meta_training:
    inner_learning_rate: 1e-3
    outer_learning_rate: ${..learning_rate}
    num_inner_steps: 5