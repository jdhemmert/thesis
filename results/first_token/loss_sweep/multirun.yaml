hydra:
  run:
    dir: ${base_output_dir}
  sweep:
    dir: ${base_output_dir}
    subdir: ${task.alpha}alpha_${task.temperature}temp
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params:
      task.alpha: 0.0, 0.25, 0.5, 0.75, 1.0
      task.temperature: 0.1, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2.0
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra: []
    task:
    - +experiment=first_token/loss_sweep
  job:
    name: main
    chdir: null
    override_dirname: +experiment=first_token/loss_sweep
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/jhemmer/projects/thesis
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/jhemmer/projects/thesis/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      experiment: first_token/loss_sweep
      task/extrinsic_validation: rouge
      prompts: default
      dataset: qa_12k
      model: augmented_llama
      model/adapter_config: null
      task: train_memory
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
project_name: thesis
seed: 42
model:
  architecture: AUGMENTED_LLAMA
  model_config:
    _target_: src.models.augmented_llama.AugmentedLlamaConfig
    model_path: meta-llama/Llama-3.2-3B
    attention_bias: false
    attention_dropout: 0.0
    bos_token_id: 128000
    dtype: bfloat16
    eos_token_id: 128001
    head_dim: 128
    hidden_act: silu
    hidden_size: 3072
    initializer_range: 0.02
    intermediate_size: 8192
    max_position_embeddings: 131072
    mlp_bias: false
    model_type: llama
    num_attention_heads: 24
    num_hidden_layers: 28
    num_key_value_heads: 8
    pretraining_tp: 1
    rms_norm_eps: 1.0e-05
    rope_scaling:
      factor: 32.0
      high_freq_factor: 4.0
      low_freq_factor: 1.0
      original_max_position_embeddings: 8192
      rope_type: llama3
    rope_theta: 500000.0
    tie_word_embeddings: true
    transformers_version: 4.57.3
    use_cache: true
    vocab_size: 128256
    virtual_token_count: 12
  adapter_config: null
  adapter_path: null
  precision: bf16
task:
  _target_: src.tasks.train_memory.TrainMemoryTask
  name: train_memory
  learning_rate: 0.0002
  lr_scheduler_type: linear
  num_train_epochs: 50
  precision: bf16
  seed: 1775761370
  max_length: 512
  eval_strategy: epoch
  eval_steps: 100
  sample_n: 1
  sample_strategy: random
  log_predictions: true
  extrinsic_validation:
    frequency: END
    metric_type: evaluate
    metric_config:
      _target_: src.eval.metrics.evaluate_metric.EvaluateMetricConfig
      metric_name: rouge
      log_predictions: true
      sample_count: 100
    generation_input_key: null
  save_strategy: 'no'
  training_arguments: {}
  loss_type: balanced
  alpha: 0.5
  temperature: 1.0
  return_metric_key: eval_loss
  initialization_method: null
  initialization_config: {}
  trainable_strategy: soft_prompt_only
dataset:
  path: data/qa_bio_attributes.jsonl
  test_split_ratio: 0.125
  streaming: false
  physical_batch_size: 4
  accumulation_steps: 1
  dataset_mode: attributes
  parser: null
  biography_task: null
prompts:
  contextual_qa_training: 'Biography: {biography}

    Question: {question}

    Answer: {answer}'
  contextual_qa_generation: 'Biography: {biography}

    Question: {question}

    Answer:'
  direct_qa_training: 'Question: {question}

    Answer: {answer}'
  direct_qa_generation: 'Question: {question}

    Answer:'
output_root: results
experiment_path: first_token
experiment_subdir: loss_sweep
base_output_dir: ${output_root}/${experiment_path}/${experiment_subdir}
